<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Technical process flow visualization -->
  <defs>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e87c6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ee7b2b;stop-opacity:0.4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grid background -->
  <g opacity="0.1">
    <path d="M0 0 L800 0 L800 400 L0 400 Z" fill="none" stroke="#2e87c6" stroke-width="0.5"/>
    <path d="M100 0 L100 400 M200 0 L200 400 M300 0 L300 400 M400 0 L400 400 M500 0 L500 400 M600 0 L600 400 M700 0 L700 400" stroke="#2e87c6" stroke-width="0.3"/>
    <path d="M0 100 L800 100 M0 200 L800 200 M0 300 L800 300" stroke="#2e87c6" stroke-width="0.3"/>
  </g>

  <!-- Flow nodes -->
  <circle cx="150" cy="200" r="40" fill="none" stroke="url(#processGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="400" cy="200" r="45" fill="none" stroke="url(#processGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="650" cy="200" r="40" fill="none" stroke="url(#processGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Connection paths -->
  <path d="M190 200 L355 200" stroke="#ee7b2b" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <path d="M445 200 L610 200" stroke="#ee7b2b" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- Data points -->
  <circle cx="270" cy="150" r="3" fill="#2e87c6" opacity="0.8"/>
  <circle cx="320" cy="180" r="2" fill="#ee7b2b" opacity="0.8"/>
  <circle cx="520" cy="160" r="3" fill="#2e87c6" opacity="0.8"/>
  <circle cx="570" cy="220" r="2" fill="#ee7b2b" opacity="0.8"/>

  <!-- Technical markers -->
  <text x="150" y="280" font-family="monospace" font-size="10" fill="#ee7b2b" text-anchor="middle" opacity="0.7">FEEDSTOCK</text>
  <text x="400" y="280" font-family="monospace" font-size="10" fill="#2e87c6" text-anchor="middle" opacity="0.7">SEPARATION</text>
  <text x="650" y="280" font-family="monospace" font-size="10" fill="#ee7b2b" text-anchor="middle" opacity="0.7">REFINEMENT</text>
</svg>
